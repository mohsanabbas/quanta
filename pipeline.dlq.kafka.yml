# Pipeline: Kafka → uppercase → Kafka sink + DLQ
# Run locally: bin/uppercase on :50052, Kafka on localhost:9094
schema_version: v1

source:
  kind: kafka
  driver: sarama
  config: kafka_source.yml

transformers:
  - name: uppercase
    type: grpc
    address: "localhost:50052"
    timeout_ms: 1000
    retry_policy:
      attempts: 3
      backoff_ms: 200

sinks:
  - kafka

sink_configs:
  kafka:
    brokers: ["localhost:9094"]
    topic: "quanta-output"
    acks: "all"
    version: "3.6.0"
    client_id: "quanta-sink"
    timeout: 10s
    retry_max: 5
    retry_backoff_min: 100ms
    retry_backoff_max: 2s

dlq:
  enabled: true
  sink: kafka
  config:
    brokers: ["localhost:9094"]
    topic: "quanta-dlq"
    acks: "all"
    version: "3.6.0"
    client_id: "quanta-dlq"
    timeout: 10s
    retry_max: 3
    retry_backoff_min: 100ms
    retry_backoff_max: 1s
