# Pipeline config: Kafka → S3 with Parquet format
# Testing schema-based data contract with ODCS-aligned schema
schema_version: v1

source:
  kind: kafka
  driver: sarama
  config: kafka_source.docker.yml

transformers:
  - name: cloudevents
    type: grpc
    address: "cloudevents:50052"
    timeout_ms: 2000
    retry_policy:
      attempts: 3
      backoff_ms: 200
    error_sink:
      sink: kafka
      config:
        brokers: ["kafka:29092"]
        topic: "quanta-dlq"
        acks: "all"
        version: "3.6.0"
        client_id: "quanta-error-sink"
        timeout: 10s

sinks:
  - s3

sink_configs:
  s3:
    bucket: quanta-output
    region: us-east-1
    prefix: parquet
    format: parquet
    schema_file: /config/schemas/ai_events.schema.yaml
    batch_size: 5000
    flush_interval: 10s
    auth_strategy: static
    access_key_id: test
    secret_access_key: test
    endpoint: http://localstack:4566
    path_style: true

debug:
  per_frame_delay_ms: 0
  print_counter: false
  ack_batch_size: 1
  ack_flush_ms: 0

dlq:
  enabled: true
  sink: kafka
  config:
    brokers: ["kafka:29092"]
    topic: "quanta-dlq"
    acks: "all"
    version: "3.6.0"
    client_id: "quanta-dlq-s3-parquet"
    timeout: 10s
    retry_max: 3
    retry_backoff_min: 100ms
    retry_backoff_max: 1s
