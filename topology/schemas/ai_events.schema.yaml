# AI Events Schema
# Data Contract: AI Gateway Events (Raw Kafka Format)
# Aligned with Open Data Contract Standard (ODCS) v3.1.0

kind: Schema
apiVersion: v1
name: ai_events
description: AI gateway events with token usage and latency metrics
domain: ai-platform
owner: platform-team
tags:
  - streaming
  - ai
  - metrics

columns:
  # Event identification (from context)
  - name: event_id
    businessName: Event Identifier
    description: Unique event contract ID
    path: context.event_contract_id
    type: string
    physicalType: String
    required: true
    classification: internal

  - name: event_type
    businessName: Event Type
    description: Type of AI event
    path: context.event
    type: string
    physicalType: LowCardinality(String)
    required: true
    classification: public

  - name: event_time
    businessName: Event Timestamp
    description: When the event was created (RFC3339)
    path: context.created_at
    type: timestamp
    physicalType: DateTime64(6, 'UTC')
    required: true
    classification: public

  - name: event_source
    businessName: Event Source
    description: Application that generated the event
    path: context.app_name
    type: string
    physicalType: String
    required: true
    classification: public

  # AI provider details (from properties)
  - name: provider
    businessName: AI Provider
    description: LLM provider name (openai, anthropic, google)
    path: properties.provider
    type: string
    physicalType: LowCardinality(String)
    required: true
    classification: public
    tags:
      - dimension

  - name: model
    businessName: Model Name
    description: Specific model used (gpt-4o, claude-opus-4, etc.)
    path: properties.model
    type: string
    physicalType: String
    required: true
    classification: public
    tags:
      - dimension

  - name: request_id
    businessName: Request Identifier
    description: Unique request ID for tracing
    path: properties.request_id
    type: string
    physicalType: String
    required: true
    classification: internal

  # Token usage metrics
  - name: input_tokens
    businessName: Input Tokens
    description: Number of tokens in the prompt
    path: properties.input_tokens
    type: int64
    physicalType: Int64
    default: 0
    classification: public
    tags:
      - metric

  - name: output_tokens
    businessName: Output Tokens
    description: Number of tokens in the response
    path: properties.output_tokens
    type: int64
    physicalType: Int64
    default: 0
    classification: public
    tags:
      - metric

  - name: total_tokens
    businessName: Total Tokens
    description: Sum of input and output tokens
    path: properties.total_tokens
    type: int64
    physicalType: Int64
    default: 0
    classification: public
    tags:
      - metric

  # Performance metrics
  - name: latency_ms
    businessName: Latency (ms)
    description: Request latency in milliseconds
    path: properties.latency_ms
    type: int64
    physicalType: Int64
    default: 0
    classification: public
    tags:
      - metric

  # Request configuration
  - name: temperature
    businessName: Temperature
    description: Sampling temperature (0.0-2.0)
    path: properties.temperature
    type: float64
    physicalType: Float64
    default: 0.0
    classification: public

  - name: stream_enabled
    businessName: Stream Enabled
    description: Whether streaming was enabled
    path: properties.stream
    type: bool
    physicalType: UInt8
    default: false
    classification: public

  # Status
  - name: status
    businessName: Status
    description: Request status (success, timeout, error, rate_limited)
    path: properties.status
    type: string
    physicalType: LowCardinality(String)
    required: true
    classification: public
    tags:
      - dimension

  - name: status_class
    businessName: Finish Reason
    description: Completion finish reason (stop, length, content_filter, tool_calls)
    path: properties.finish_reason
    type: string
    physicalType: LowCardinality(String)
    default: ""
    classification: public

  # Tenant context
  - name: environment
    businessName: Environment
    description: Deployment environment (prod, staging, canary)
    path: context.environment
    type: string
    physicalType: LowCardinality(String)
    default: ""
    classification: public
    tags:
      - dimension

  - name: org_id
    businessName: Organization ID
    description: Customer organization identifier
    path: context.org_id
    type: string
    physicalType: String
    default: ""
    classification: confidential
    tags:
      - pii

  - name: user_id
    businessName: User Identifier
    description: User who made the request
    path: context.user_id
    type: string
    physicalType: String
    default: ""
    classification: confidential
    tags:
      - pii
