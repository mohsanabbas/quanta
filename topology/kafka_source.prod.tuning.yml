# ==============================================================================
# KAFKA SOURCE TUNING (Production / 150k RPS)
# ==============================================================================
# Automatically loaded alongside kafka_source.prod.yml by the engine.
# Tuned for 150,000 events/sec peak across 48 partitions on Amazon MSK.
#
# Scale math at peak:
#   150k RPS / 8 engine pods = 18,750 events/s per pod
#   avg event ~1 KB → ~18.75 MB/s per pod
#   inflight_msgs = 50,000 → at 18,750/s ≈ 2.7s of buffer
#   inflight_bytes = 512 MiB → safely absorbs a 2–3s transformer hiccup
# ==============================================================================

# ------------------------------------------------------------------------------
# IN-FLIGHT LIMITS (Backpressure Control)
# ------------------------------------------------------------------------------

# 512 MiB total in-flight bytes cap across all partitions on this pod.
# Prevents OOM if transformer slows. Size pod memory ≥ 4 GiB (request)
# to leave headroom for Go runtime + Sarama fetch buffers.
inflight_bytes: 536870912  # 512 MiB

# 50,000 concurrent in-flight messages (raised from 4,096 in dev).
# At 18,750 events/s per pod this is ~2.7s of buffer.
# Keep well below partition count × Kafka max fetch size.
inflight_msgs: 50000

# ------------------------------------------------------------------------------
# CHECKPOINT WINDOW (E2E mode — sliding window)
# ------------------------------------------------------------------------------

# Must be >= inflight_msgs. 32,768 gives comfortable headroom for
# out-of-order acks from the async Kafka + gRPC + sink pipeline.
# Memory cost: 32768 / 8 = 4 KB per partition (negligible).
window_bits: 32768  # 2× inflight_msgs rounded to next power of 2

# ------------------------------------------------------------------------------
# COMMIT TIMING (Hybrid Strategy)
# ------------------------------------------------------------------------------

# Commit at least every 5 seconds regardless of message count.
# Prevents stuck partitions during low-throughput periods.
commit_interval: 5s

# Commit every 1,000 acknowledged messages.
# At 18,750 events/s this triggers roughly every 50ms — fine-grained progress.
commit_step: 1000

# ==============================================================================
# NOTES
# ==============================================================================
#
# Kafka fetch tuning is handled by the Sarama driver defaults which already
# target large batches. If consumer lag grows persistently under peak load,
# consider tuning fetch.default.bytes and fetch.max.bytes in the Sarama
# config struct (requires code-level change in source/kafka).
#
# Memory per pod at peak:
#   inflight_bytes   = 512 MiB (message payloads)
#   checkpoint bitmaps = 48 partitions × 4 KB = 192 KB
#   Go runtime + Sarama = ~500 MiB
#   Total worst case  ≈ 1 GiB
#   Pod memory limit  = 8 GiB → safe with 8× headroom
# ==============================================================================
