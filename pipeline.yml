# schema_version for pipeline spec
schema_version: v1

source:
  kind: kafka
  driver: sarama
  config: kafka_source.yml

transformers:
  - name: uppercase
    type: grpc
    address: "localhost:50052"   # for host runs; in Docker use pipeline.docker.yml with service name
    max_in_flight: 100
    timeout_ms: 1000
    content_type: "application/protobuf"
    retry_policy:
      attempts: 3
      backoff_ms: 200

sinks:
  - stdout
  - kafka
#old
#sink_configs:
#  kafka:
#    brokers:
#      - "localhost:9094"
#    topic: "quanta-output"
#    required_acks: 1

#new
sink_configs:
  stdout: {}
  kafka:
    brokers: ["localhost:9094"]
    topic: "quanta-output"
    version: "3.6.0"
    client_id: "quanta-sink"
    acks: "all"               # none|local|all
    timeout: 10s
    retry_max: 5
    retry_backoff_min: 100ms
    retry_backoff_max: 2s
    # header_topic_key: "kafka.topic"  # optional

debug:
  per_frame_delay_ms: 0
  print_counter: true
  ack_batch_size: 1
  ack_flush_ms: 0
  print_value: true
  value_max_bytes: 180
