# schema_version for Kafka source spec (Docker)
schema_version: v1

brokers:
  - "kafka:29092"

topics:
  - "event-tracking_track-events-approved"

group_id: "quanta-src-track-events-approved"
start_from: "oldest"

version: "3.6.0"

commit_mode: "e2e"

backpressure:
  capacity: 1000

checkpoint:
  commit_interval: 0ms

tls_enabled: false
sasl_user: ""
sasl_pass: ""
