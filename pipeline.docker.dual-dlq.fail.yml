# Pipeline: Kafka → cloudevents → Kafka sink (BAD TOPIC) + Engine DLQ (Docker)
#
# Purpose: Force BOTH error paths in the same pipeline:
#   1. Plugin error_events: cloudevents rejects bad events → error_events field
#      Engine routes to transformer's error_sink (quanta-dlq).
#   2. Engine DLQ: ALL sink publish errors → coord.Nack → quanta-engine-dlq
#
# Expected: healthy events fail at sink (bad topic) → engine DLQ.
#           unhealthy events → error_sink (quanta-dlq).
schema_version: v1

source:
  kind: kafka
  driver: sarama
  config: kafka_source.docker.yml

transformers:
  - name: cloudevents
    type: grpc
    address: "cloudevents:50052"
    timeout_ms: 2000
    retry_policy:
      attempts: 3
      backoff_ms: 200
    error_sink:
      sink: kafka
      config:
        brokers: ["kafka:29092"]
        topic: "quanta-dlq"
        acks: "all"
        version: "3.6.0"
        client_id: "quanta-error-sink-bad"
        timeout: 10s

sinks:
  - kafka

sink_configs:
  kafka:
    brokers: ["kafka:29092"]
    topic: "quanta-nonexistent-topic"
    acks: "all"
    version: "3.6.0"
    client_id: "quanta-sink-bad"
    timeout: 5s
    retry_max: 1
    retry_backoff_min: 100ms
    retry_backoff_max: 500ms

dlq:
  enabled: true
  sink: kafka
  config:
    brokers: ["kafka:29092"]
    topic: "quanta-engine-dlq"
    acks: "all"
    version: "3.6.0"
    client_id: "quanta-engine-dlq-bad"
    timeout: 10s
    retry_max: 3
    retry_backoff_min: 100ms
    retry_backoff_max: 1s
