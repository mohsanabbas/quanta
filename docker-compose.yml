services:
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: quanta-kafka
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server kafka:29092 --list || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      # KRaft mode — no ZooKeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9094,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - quanta-net

  kafka-init:
    image: confluentinc/cp-kafka:7.9.0
    container_name: quanta-kafka-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo '⏳ Creating Kafka topics...'
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic event-tracking_track-events-approved \
          --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic quanta-output \
          --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic quanta-dlq \
          --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic quanta-engine-dlq \
          --partitions 3 --replication-factor 1
        echo '✅ Topics ready:'
        kafka-topics --bootstrap-server kafka:29092 --describe \
          --topic event-tracking_track-events-approved
        kafka-topics --bootstrap-server kafka:29092 --describe \
          --topic quanta-output
        kafka-topics --bootstrap-server kafka:29092 --describe \
          --topic quanta-dlq
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - quanta-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: quanta-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - quanta-net

  #  uppercase:
  #    image: quanta-uppercase:local
  #    container_name: quanta-uppercase
  #    build:
  #      context: .
  #      dockerfile: Dockerfile.uppercase
  #      args:
  #        BIN_DIR: "bin/linux-${ARCH:-arm64}"
  #    expose:
  #      - "50052"
  #    depends_on:
  #      kafka-init:
  #        condition: service_completed_successfully
  #    networks:
  #      - quanta-net

  cloudevents:
    image: quanta-cloudevents:local
    container_name: quanta-cloudevents
    build:
      context: .
      dockerfile: Dockerfile.cloudevents
      args:
        BIN_DIR: "bin/linux-${ARCH:-arm64}"
    expose:
      - "50052"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - quanta-net

  localstack:
    image: localstack/localstack:4.4
    container_name: quanta-localstack
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - quanta-net

  s3manager:
    image: cloudlena/s3manager
    container_name: quanta-s3manager
    restart: unless-stopped
    environment:
      ENDPOINT: localstack:4566
      ACCESS_KEY_ID: test
      SECRET_ACCESS_KEY: test
      USE_SSL: "false"
      SKIP_SSL_VERIFICATION: "true"
    ports:
      - "8082:8080"
    depends_on:
      localstack:
        condition: service_started
    networks:
      - quanta-net

  localstack-init:
    image: amazon/aws-cli:latest
    container_name: quanta-localstack-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo '⏳ Waiting for LocalStack S3...'
        until aws --endpoint-url=http://localstack:4566 s3 ls 2>/dev/null; do sleep 1; done
        if aws --endpoint-url=http://localstack:4566 s3 ls s3://quanta-output >/dev/null 2>&1; then
          echo '✅ S3 bucket already exists: quanta-output'
        else
          aws --endpoint-url=http://localstack:4566 s3 mb s3://quanta-output
        fi
        echo '✅ S3 bucket ready:'
        aws --endpoint-url=http://localstack:4566 s3 ls
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      localstack:
        condition: service_started
    networks:
      - quanta-net

  engine:
    image: quanta-engine:local
    container_name: quanta-engine
    build:
      context: .
      dockerfile: Dockerfile.engine
      args:
        BIN_DIR: "bin/linux-${ARCH:-arm64}"
    environment:
      - QUANTA_PIPELINE_YML=/config/${QUANTA_PIPELINE_FILE:-pipeline.docker.yml}
    volumes:
      - ./pipeline.docker.s3.yml:/config/pipeline.docker.s3.yml:ro
      - ./pipeline.docker.yml:/config/pipeline.docker.yml:ro
      - ./pipeline.docker.dual-dlq.yml:/config/pipeline.docker.dual-dlq.yml:ro
      - ./pipeline.docker.dual-dlq.fail.yml:/config/pipeline.docker.dual-dlq.fail.yml:ro
      - ./pipeline.docker.s3-dlq.yml:/config/pipeline.docker.s3-dlq.yml:ro
      - ./pipeline.docker.s3-dlq.fail.yml:/config/pipeline.docker.s3-dlq.fail.yml:ro
      - ./kafka_source.docker.yml:/config/kafka_source.docker.yml:ro
      - ./kafka_source.docker.tuning.yml:/config/kafka_source.docker.tuning.yml:ro
      - ./kafka_source.docker.auto.yml:/config/kafka_source.docker.auto.yml:ro
      - ./kafka_source.docker.auto.tuning.yml:/config/kafka_source.docker.auto.tuning.yml:ro
      - ./kafka_source.docker.safe.yml:/config/kafka_source.docker.safe.yml:ro
      - ./kafka_source.docker.safe.tuning.yml:/config/kafka_source.docker.safe.tuning.yml:ro
    ports:
      - "9100:9100"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cloudevents:
        condition: service_started
    networks:
      - quanta-net

networks:
  quanta-net:
    driver: bridge

volumes:
  kafka_data:
  localstack_data:
