# ==============================================================================
# KAFKA SOURCE TUNING CONFIGURATION (Docker Environment)
# ==============================================================================
# These are internal tuning parameters for the Kafka source.
# This file is automatically loaded alongside kafka_source.docker.yml
# ==============================================================================

# ------------------------------------------------------------------------------
# IN-FLIGHT LIMITS (Backpressure Control)
# ------------------------------------------------------------------------------

# Maximum bytes held in-flight (for combined backpressure)
# E2E mode: Messages held in memory until sink acknowledges
# Calculation: avg_msg_size × inflight_msgs
# Example: 10KB × 4096 = ~40MB per partition × 12 partitions = ~480MB
inflight_bytes: 268435456  # 256 MiB

# Maximum number of unacknowledged messages
# - Too low: Underutilizes pipeline, low throughput
# - Too high: High memory usage, long replay on restart
# - Sweet spot: 2000-5000 for balanced performance
inflight_msgs: 4096

# ------------------------------------------------------------------------------
# CHECKPOINT WINDOW (E2E Mode)
# ------------------------------------------------------------------------------

# Sliding window size in bits
# MUST be >= inflight_msgs
# Recommended: 2× inflight_msgs for out-of-order ack handling
# - Larger window = more memory but handles async processing better
# - Smaller window = less memory but may block on out-of-order acks
window_bits: 8192  # 2× inflight_msgs = 8192

# ------------------------------------------------------------------------------
# COMMIT TIMING (Hybrid Strategy)
# ------------------------------------------------------------------------------

# Commit at least every 5 seconds
# - Ensures progress even if acks are slow or out-of-order
# - Prevents stuck partitions (like your partition 3 issue!)
# - Smaller value = smaller replay window on restart
# - Larger value = better throughput, less broker load
commit_interval: 5s

# Commit every 128 acknowledged messages
# - Triggers commit when checkpoint base advances by this many offsets
# - Smaller value = more frequent commits, smaller replay
# - Larger value = fewer commits, better throughput
commit_step: 128

# ==============================================================================
# NOTES ON YOUR CURRENT SETUP
# ==============================================================================
#
# With 12 partitions consuming from event-tracking_track-events-approved:
#
# Memory Usage per Partition:
# - Checkpoint tracking: window_bits / 8 = 8192 / 8 = 1KB
# - In-flight messages: inflight_msgs × avg_msg_size
#   If avg message is 10KB: 4096 × 10KB = 40MB
#
# Total Memory (all 12 partitions):
# - 12 × 40MB = ~480MB for message buffers
# - Plus overhead for checkpoint tracking and Go runtime
# - Recommended: At least 1GB RAM for the engine container
#
# Commit Behavior:
# - Every 5 seconds (time-based) OR
# - Every 128 messages (step-based)
# - Whichever happens first
#
# This prevents the "partition 3 stuck at 95 lag" issue you were seeing!
# ==============================================================================

