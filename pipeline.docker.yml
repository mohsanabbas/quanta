# schema_version for pipeline spec (Docker)
schema_version: v1

source:
  kind: kafka
  driver: sarama
  # RECOMMENDED: Balanced E2E mode with automatic tuning
  config: kafka_source.docker.yml
  # Automatically loads: kafka_source.docker.tuning.yml

  # OTHER OPTIONS (uncomment to test):
  # config: kafka_source.docker.auto.yml        # High throughput, some loss acceptable
#  config: kafka_source.docker.safe.yml        # Maximum safety, frequent commits

transformers:
  - name: uppercase
    type: grpc
    address: "uppercase:50052"
    max_in_flight: 100
    timeout_ms: 1000
    content_type: "application/protobuf"
    retry_policy:
      attempts: 3
      backoff_ms: 200

sinks:
  - stdout
  - kafka

sink_configs:
  stdout:
    print_counter: true
    print_value: true
    value_max_bytes: 200
    ack_batch_size: 100
    ack_flush_ms: 500
  kafka:
    brokers: ["kafka:29092"]
    topic: "quanta-output"
    acks: "all"
    version: "3.6.0"
    client_id: "quanta-sink"
    timeout: 10s
    retry_max: 5
    retry_backoff_min: 100ms
    retry_backoff_max: 2s

debug:
  per_frame_delay_ms: 0
  print_counter: true
  ack_batch_size: 1
  ack_flush_ms: 0
